<form [formGroup]="modificationCardForm" class="modification-card-modal flex flex-column">
  <div class="header flex flex-row">
    <button type="button" class="close-modal-button" (click)="closeModal()">X</button>
    <h2 class="modification-card-modal-title">Entities and configuration</h2>
  </div>

  <smart-home-input-field
    type="text"
    text="Title (optional)"
    bunch="title"
    [control]="modificationCardForm.controls.title"
  />

  <div class="entities flex flex-column">
    <h3>Entities</h3>

    <ul class="entities-items flex flex-column">
      @for (item of entities(); track item.label) {
        <div class="entity-block flex flex-row">
          <li class="flex flex-row">
            <button [disabled]="true">
              <mat-icon class="icon">{{ item.icon }}</mat-icon>
            </button>

            <p>{{ item.label }}</p>
          </li>

          <button class="remove-button" (click)="removeItem(item.label)">X</button>
        </div>
      }
    </ul>
  </div>

  <div class="managment-edit-card flex flex-row">
    <button type="submit" class="managment-card-entities">CANCEL</button>
    <button type="submit" class="managment-card-entities" (click)="saveUpdatedCard()">SAVE</button>
  </div>
</form>
