<mat-icon class="toggle-switcher-icon" smartHomeDeviceHighlight [active]="item().state">{{
  item().icon
}}</mat-icon>
<p>{{ item().label }}</p>
<button
  class="toggle-switcher"
  [class.active]="item().state"
  (click)="toggleSwitcher(this.card().id, item().label)"
>
  <span class="switcher-round"></span>
</button>
